name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
        env:
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "orchid-sdd@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already published, skipping."
            exit 0
          fi

          if [ -n "${NPM_TOKEN_SECRET:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN_SECRET"
          else
            ID_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
            NPM_TOKEN=$(curl -sS -X POST \
              -H "Authorization: Bearer $ID_TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/orchid-sdd" | jq -r .token)
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi

          npm publish --provenance --access public
